# Project-wide Gradle settings optimized for 3GB RAM and Windows stability.

# JVM heap at 1280m is the "sweet spot" for 3GB RAM systems.
# TieredStopAtLevel=1 reduces memory overhead of the compiler.
# preferIPv4Stack and http.keepAlive=false fix "Connection reset" issues on Windows.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dhttp.keepAlive=false -Dsun.net.client.defaultConnectTimeout=120000 -Dsun.net.client.defaultReadTimeout=120000 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Dorg.gradle.internal.repository.max.retries=20 -Dorg.gradle.internal.repository.max.tentatives=20

# Force networking stability for Gradle's internal operations
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
systemProp.sun.net.client.defaultConnectTimeout=120000
systemProp.sun.net.client.defaultReadTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Run Kotlin compiler inside the Gradle process to save 500MB+ RAM by avoiding a second JVM.
kotlin.compiler.execution.strategy=in-process

# Disable daemons and parallel execution to minimize memory footprint.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.workers.max=1

# AndroidX and Style
android.useAndroidX=true
kotlin.code.style=official

# AGP 8.7.3 todavía no cataloga compileSdk 36 como oficialmente soportado (aunque
# funciona bien) — silencia esa advertencia en vez de dejarla como ruido en cada build.
android.suppressUnsupportedCompileSdk=36

# Optimization flags for low memory
android.nonTransitiveRClass=true
android.enableAppCompileTimeRClass=false
kotlin.incremental=false
ksp.incremental=false

# Networking fixes for any unavoidable background workers
kotlin.daemon.jvmargs=-Xmx512m -XX:TieredStopAtLevel=1 -Djava.net.preferIPv4Stack=true -Dhttp.keepAlive=false
